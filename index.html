<script>
// FINAL PRODUCTION FIX - Login persistence fixed for Android Chrome
(function(){
  try {
    // Fix 1: Initialize from localStorage synchronously to prevent race
    let savedUser = null;
    let savedToken = null;
    try {
      savedUser = localStorage.getItem("ne_current_user");
      savedToken = localStorage.getItem("ne_auth_token");
      if(savedUser){
        savedUser = JSON.parse(savedUser);
        console.log("NE: Restored user from localStorage on init:", savedUser.username);
      }
    } catch(e){ console.log("No saved user"); }
    
    // FIXED AUTH PERSISTENCE: No blocking - logout must work instantly
    window._neAllowLogout = function(){ return true; };
    // Verify token on load - if invalid, clear storage so refresh doesn't show ghost login
    
    
    // Fix 3: Verify token on load if exists
    if(savedToken && savedUser){
      fetch("/api/verify",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({token: savedToken})
      }).then(r=>r.json()).then(d=>{
        if(!d.valid){
          console.log("NE: Token invalid, clearing session");
          origRemove("ne_current_user");
          origRemove("ne_auth_token");
        } else {
          console.log("NE: Token valid, user remains logged in");
        }
      }).catch(e=>{ console.log("NE: Verify failed, keeping local session for offline", e); });
    }
    
    // Fix 4: Ensure login fields are BLANK on open
    setTimeout(()=>{
      document.querySelectorAll('input').forEach(inp=>{
        if(inp.type==="text" || inp.type==="password"){
          let ph = (inp.placeholder||"").toLowerCase();
          if(ph.includes("username") || ph.includes("password") || ph.includes("••••")){
            // Don't set value, ensure blank - clear any autofill after 100ms
            if(inp.value && !savedUser){
              // Only clear if not already logged in
              setTimeout(()=>{ if(!localStorage.getItem("ne_current_user")) inp.value=""; }, 100);
            }
          }
        }
      });
    }, 200);
    
  } catch(e){ console.error("Persistence fix error", e); }
})();
</script>

ts:"Weaving, folk dance",population:"~700k",references:["Mishing Autonomous Council"],imageUrl:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"},{id:"t24",name:"Reang",altNames:["Bru"],state:"Tripura",district:"North Tripura",language:"Bru",history:"Second largest tribe in Tripura, internally displaced history.",culture:"Buisu harvest festival.",festivals:"Buisu",food:"Rice, fish, pork",clothing:"Rignai",arts:"Hojagiri dance",population:"~200k",references:["Tripura Govt"],imageUrl:"https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=600"},{id:"t25",name:"Monpa",altNames:[],state:"Arunachal Pradesh",district:"Tawang",language:"Monpa",history:"Tibetan Buddhist community near Bhutan border.",culture:"Tawang Monastery.",festivals:"Losar, Choskar",food:"Thukpa, Momos",clothing:"Chupa",arts:"Thangka, mask dance",population:"~60k",references:["Tawang Monastery"],imageUrl:"https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?w=600"},{id:"t26",name:"Lepcha - Darlong",altNames:["Darlong"],state:"Tripura",district:"Unakoti",language:"Darlong",history:"Small Kuki-Chin community.",culture:"Oral traditions.",festivals:"Mansai Kut",food:"Rice, wild vegetables",clothing:"Traditional woven",arts:"Folk tales",population:"~15k",references:["Tripura Tribal Research"],imageUrl:"https://images.unsplash.com/photo-1517760444937-f6397edcbbcd?w=600"},{id:"t27",name:"Pai-Hmar-Khasi Syncretic",altNames:["Mixed Heritage"],state:"Meghalaya",district:"Ri-Bhoi",language:"Mixed",history:"Representative of inter-community heritage in border regions.",culture:"Shared sacred groves.",festivals:"Mixed",food:"Fusion NE cuisine",clothing:"Mixed weaves",arts:"Collaborative crafts",population:"—",references:["NEHU Study"],imageUrl:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600"}],N1=[{id:"a1",title:"Ziro Valley",slug:"ziro-valley",state:"Arunachal Pradesh",intro:"Ziro Valley is a UNESCO World Heritage tentative site in Arunachal Pradesh, famous for its Apatani cultural landscape and sustainable paddy-cum-fish cultivation.",content:`Ziro Valley, located at 1,500m in Lower Subansiri district, is home to the Apatani tribe. The valley is celebrated for its unique wet rice cultivation combined with fish farming, a system developed over centuries without modern machinery. The surrounding pine-clad hills and traditional village architecture make it a living cultural landscape.

The Apatanis practice sustainable agriculture where paddy fields are integrated with fish culture, providing both grain and protein. This system is maintained by elaborate irrigation channels managed communally.

Talley Valley Wildlife Sanctuary nearby harbors clouded leopards and diverse orchids.`,categories:["Geography","Culture","Arunachal Pradesh"],tags:["Ziro","Apatani","UNESCO"],references:["UNESCO Tentative List - Apatani Cultural Landscape","Government of Arunachal Pradesh - Ziro Valley"],relatedIds:["a2"],authorId:"u1",authorName:"Ben Yanthan",createdAt:"2024-01-15",updatedAt:"2024-11-20",verified:!0,views:3420,imageUrl:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800",infobox:{Elevation:"1,500m",District:"Lower Subansiri",Tribe:"Apatani",BestSeason:"March-October"},talk:[{user:"Editor_Lhamo",text:"We should add information about Dree festival dates",date:"2024-10-01"}]},{id:"a2",title:"Hornbill Festival",slug:"hornbill-festival",state:"Nagaland",intro:"The Hornbill Festival is a 10-day annual cultural extravaganza held at Kisama Heritage Village near Kohima, Nagaland, showcasing the rich cultural heritage of all Naga tribes.",content:`Started in 2000, the Hornbill Festival is called the Festival of Festivals. It brings together all 17 major Naga tribes at one location. The festival features traditional dances, indigenous games, Naga Morungs exhibitions, food stalls, and night bazaars.

Each tribe sets up a traditional Morung (youth dormitory) displaying artifacts, crafts, and daily life. The festival also includes the Hornbill International Music Festival and Hornbill International Motor Rally.

The festival aims to revive, protect, and preserve Naga culture and to display its extravaganzas and traditions.`,categories:["Festivals","Nagaland","Culture"],tags:["Hornbill","Naga","Kohima"],references:["Government of Nagaland - Hornbill Festival","Nagaland Tourism"],relatedIds:["a1"],authorId:"u2",authorName:"Editor Team",createdAt:"2024-02-10",updatedAt:"2024-12-01",verified:!0,views:5890,imageUrl:"https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=800",infobox:{Location:"Kisama Heritage Village",Duration:"10 days (Dec 1-10)",Organizer:"Govt of Nagaland",Tribes:"17 major tribes"},talk:[]},{id:"a3",title:"Living Root Bridges",slug:"living-root-bridges",state:"Meghalaya",intro:"Living root bridges are handmade from the aerial roots of rubber fig trees by Khasi and Jaintia peoples, found in the deep forests of Meghalaya.",content:`In the wettest place on Earth, around Cherrapunji, the Khasi tribe has for centuries trained the roots of Ficus elastica across rivers and streams. These bridges take 15-20 years to become strong enough to bear weight, but can last hundreds of years.

The Double-Decker Root Bridge in Nongriat village is two-tiered and over 180 years old. The process involves guiding young roots through hollowed betel nut trunks until they reach the other side.

These bridges are an example of bio-engineering and symbiosis between humans and nature.`,categories:["Architecture","Meghalaya","Nature"],tags:["Root Bridge","Khasi","Cherrapunji"],references:["Meghalaya Tourism","UNESCO"],relatedIds:[],authorId:"u1",authorName:"Ben Yanthan",createdAt:"2024-03-05",updatedAt:"2024-11-15",verified:!0,views:4210,imageUrl:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800",infobox:{Material:"Ficus elastica roots",Location:"Cherrapunji, Nongriat",Age:"Up to 500 years",Technique:"Guided root growth"},talk:[]},{id:"a4",title:"Majuli Island",slug:"majuli-island",state:"Assam",intro:"Majuli is the world’s largest inhabited river island, located on the Brahmaputra River in Assam, and the seat of Vaishnavite culture.",content:`Majuli Island, with an area that has shrunk from 1,250 sq km historically to about 350 sq km due to erosion, is still considered the largest river island. It is home to 22 Vaishnavite Satras (monasteries) established by 15th-century saint Srimanta Sankardev.

The island is a hub of Assamese culture, with traditional mask-making, pottery, and boat-making. The Mishing tribe is the main inhabitant.

Majuli was declared a district in 2016.`,categories:["Geography","Assam","Culture"],tags:["Majuli","Brahmaputra","Satra"],references:["Government of Assam","Majuli District Administration"],relatedIds:[],authorId:"u2",authorName:"Editor Team",createdAt:"2024-04-01",updatedAt:"2024-10-20",verified:!0,views:3120,imageUrl:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800",infobox:{River:"Brahmaputra",Area:"~350 sq km",District:"Majuli",Culture:"Vaishnavite Satra"},talk:[]},{id:"a5",title:"Cheraw Dance",slug:"cheraw-dance",state:"Mizoram",intro:"Cheraw is a traditional cultural dance performed by Mizos using bamboo staves, often called bamboo dance.",content:`Cheraw dance involves six to eight people holding pairs of bamboo staves on another bamboo, creating rhythmic beats. Female dancers step in and out of the bamboo blocks. It requires skill and timing.

Originally, Cheraw was performed to ensure safe passage for a deceased mother’s soul to paradise and to show reverence.

Today it is performed at Chapchar Kut and other festivals.`,categories:["Arts & Crafts","Mizoram","Dance"],tags:["Cheraw","Mizo","Bamboo"],references:["Mizoram Art & Culture Dept"],relatedIds:[],authorId:"u3",authorName:"Moderator Rini",createdAt:"2024-05-12",updatedAt:"2024-11-10",verified:!0,views:2100,imageUrl:"https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800",infobox:{Origin:"Mizo",Props:"Bamboo staves",Occasion:"Festivals, rituals",Dancers:"6-10"},talk:[]},{id:"a6",title:"Unakoti",slug:"unakoti",state:"Tripura",intro:"Unakoti is an ancient Shaivite pilgrimage site in Tripura with massive rock-cut sculptures and images dating to 7th-9th century.",content:`Unakoti means one less than a crore (koti). Legend says one crore gods and goddesses were traveling to Kashi, rested here overnight, but failed to wake at sunrise, turned to stone.

The central 30-feet high Shiva head called Unakotiswara Kal Bhairava is the main attraction. The site shows tribal and Shaivite fusion.

It is maintained by Archaeological Survey of India.`,categories:["History","Tripura","Places"],tags:["Unakoti","Shiva","Rock-cut"],references:["Archaeological Survey of India","Tripura Tourism"],relatedIds:[],authorId:"u1",authorName:"Ben Yanthan",createdAt:"2024-06-18",updatedAt:"2024-09-30",verified:!0,views:2890,imageUrl:"https://images.unsplash.com/photo-1486915309851-b0cc1f8a0084?w=800",infobox:{Location:"Unakoti District",Period:"7th-9th century",Deity:"Shiva",Type:"Rock-cut sculptures"},talk:[]}],z1=[{id:"d1",word:"Kohima",language:"Angami",tribe:"Angami Naga",state:"Nagaland",meaning:"Land where the flower Kewhi grows",example:"Kohima is the capital of Nagaland.",pronunciation:"ko-HEE-ma",altSpelling:"Kewhima",contributor:"Ben Yanthan",source:"Oral history",dateAdded:"2024-01-20"},{id:"d2",word:"Bai",language:"Mizo",tribe:"Mizo",state:"Mizoram",meaning:"Steamed vegetables with pork and bamboo shoot",example:"Bai is healthy Mizo dish",pronunciation:"bye",altSpelling:"",contributor:"Editor Team",source:"Mizo Cookbook",dateAdded:"2024-02-15"},{id:"d3",word:"Jadoh",language:"Khasi",tribe:"Khasi",state:"Meghalaya",meaning:"Rice cooked with meat and spices",example:"Jadoh is popular in Shillong",pronunciation:"ja-doh",altSpelling:"Ja Doh",contributor:"Moderator Rini",source:"Khasi Cuisine",dateAdded:"2024-03-01"},{id:"d4",word:"Apong",language:"Mishing",tribe:"Mishing",state:"Assam",meaning:"Rice beer",example:"Apong served during Ali-Aye-Ligang",pronunciation:"a-pong",altSpelling:"Apong",contributor:"Ben Yanthan",source:"Mishing Community",dateAdded:"2024-03-10"},{id:"d5",word:"Puan",language:"Mizo",tribe:"Mizo",state:"Mizoram",meaning:"Traditional handwoven wrap",example:"Mizo puan has intricate designs",pronunciation:"poo-an",altSpelling:"",contributor:"Editor Team",source:"Mizo Textiles",dateAdded:"2024-04-01"}],T1=[{id:"s1",title:"How the Ziro Valley Got Its Fish-Rice Fields",content:"Long ago, the Apatani elders noticed water stayed longer in lower fields. One wise woman, Takhe Helling, suggested digging small channels and introducing local fish species that clean the fields. Thus began the sustainable system that feeds the valley to this day. Villagers still maintain the channels together before monsoon.",tribe:"Apatani",location:"Ziro, Arunachal Pradesh",period:"Oral history, pre-colonial",author:"Community Elder - Takhe Family",type:"oral",tags:["Apatani","Ziro","Agriculture"],dateAdded:"2024-02-20"},{id:"s2",title:"The Stone That Saved Kohima",content:"During World War II, a Naga guide named Neihu Angami led British-Indian troops through a hidden path in Kohima ridge, avoiding Japanese encirclement. The path is now marked by a small stone near Kohima War Cemetery. Villagers say prayers there for peace.",tribe:"Angami Naga",location:"Kohima, Nagaland",period:"1944, WWII",author:"Benjamin Yanthan (documented)",type:"historical",tags:["WWII","Kohima","History"],dateAdded:"2024-05-01"}],O1=[{id:"p1",name:"Rani Gaidinliu",role:"Freedom Fighter & Spiritual Leader",state:"Nagaland",bio:"Naga spiritual and political leader who led resistance against British rule in early 20th century. Revered across Zeliangrong community.",achievements:"Padma Bhushan, Freedom fighter, Heraka movement",imageUrl:"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=600"},{id:"p2",name:"Bhupen Hazarika",role:"Musician, Filmmaker, Poet",state:"Assam",bio:"Legendary Assamese singer-composer known as Sudhakantha, bridging folk and contemporary music.",achievements:"Bharat Ratna, Dadasaheb Phalke Award",imageUrl:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600"}],R1=[{id:"pl1",name:"Tawang Monastery",type:"Monastery",state:"Arunachal Pradesh",district:"Tawang",description:"Largest monastery in India and second largest in world, founded in 1680-81 by Merak Lama Lodre Gyatso.",significance:"Center of Mahayana Buddhism, houses ancient scriptures",imageUrl:"https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?w=80 istrative and cultural centre, overlooking the Doyang river valley. Wokha district is well known across Nagaland for its terraced paddy fields and for Mount Tiyi (Mount Tokhu), a hill of cultural and spiritual significance to the Lotha people. Agriculture, particularly rice cultivation, has long been central to livelihoods in the area. Wokha's Lotha community observes distinct festivals, most notably the Tokhu Emong post-harvest festival, celebrated in November. The town continues to grow as a regional hub for education and local commerce while retaining strong ties to its agricultural and tribal heritage.", "categories": ["Featured", "Cities & Towns"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []},
{"id": "seed_about_nagaland", "title": "About Nagaland", "slug": "about-nagaland", "state": "Nagaland", "intro": "Nagaland is a state in Northeast India known for its rich tribal diversity, hill landscapes, and vibrant festivals.", "content": "Nagaland is one of the Seven Sister States of Northeast India, bordered by Assam, Manipur, Arunachal Pradesh, and Myanmar. Its capital is Kohima, and its largest city is Dimapur. The state is home to sixteen major recognised tribes, along with several sub-tribes, each with its own distinct language, dress, and customs, making Nagaland one of the most linguistically diverse states in India. The Hornbill Festival, held every December in Kohima, brings together Naga tribes to showcase their traditions, music, crafts, and cuisine, and has become one of the most well-known cultural events in the region. Nagaland's terrain is largely hilly and forested, and agriculture, particularly terrace and jhum (shifting) cultivation, remains an important part of life for many communities. Christianity is the predominant religion in the state today, coexisting alongside strong indigenous cultural practices.", "categories": ["Featured", "States & Districts"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []},
{"id": "seed_naga_youth_entrepreneurs", "title": "Naga Youth: A Growing Wave of Entrepreneurship", "slug": "naga-youth:-a-growing-wave-of-entrepreneurship", "state": "Nagaland", "intro": "Young entrepreneurs across Nagaland and the wider Northeast are building local businesses rooted in agriculture, food, and craft.", "content": "Across Nagaland and the Northeast more broadly, a growing number of young people are choosing entrepreneurship over migration for jobs, building small businesses around locally available resources. Many of these ventures are rooted in agriculture and food processing, such as packaging and marketing indigenous produce like Naga king chilli, bamboo shoot products, and organic vegetables, connecting traditional farming knowledge with modern branding and e-commerce. Others have built businesses around traditional weaving and handloom products, giving Naga textile patterns a wider market beyond the region. Startup support programmes run by state governments and central schemes aimed at the Northeast have also helped some young entrepreneurs access funding, training, and mentorship. While challenges around infrastructure, transport, and market access remain real, this entrepreneurial energy among Naga youth reflects a broader, positive trend of building livelihoods that stay connected to home and community.", "categories": ["Featured", "Local Businesses"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []},
{"id": "seed_ne_flood_2026", "title": "Monsoon Floods and Landslides Across Northeast India, 2026", "slug": "monsoon-floods-and-landslides-across-northeast-india-2026", "state": "Assam", "intro": "The 2026 monsoon brought severe flooding and landslides across Assam, Arunachal Pradesh, and neighbouring states, prompting large-scale rescue operations.", "content": "The 2026 monsoon season brought severe and prolonged flooding to parts of Northeast India, particularly Assam and Arunachal Pradesh, with heavy rainfall also triggering landslides in Meghalaya, Sikkim, and Nagaland. In Assam, districts including Dhemaji, Lakhimpur, and Dibrugarh were among the worst affected, with tens of thousands of people displaced and large areas of agricultural land inundated. In Dhemaji, riverbank erosion caused the partial collapse of a railway bridge over the Simen River, disrupting train services and cutting off several villages. A cloudburst in Nagaland's Mon district also contributed to rising water levels and flooding downstream in parts of Assam. Rescue and relief operations involved the Indian Air Force, the National Disaster Response Force (NDRF), the State Disaster Response Force (SDRF), and local district authorities, who used helicopters and boats to reach communities cut off by damaged roads and swollen rivers. Union and state government officials coordinated relief assistance as the flooding continued through the monsoon period. Recurring floods remain a serious annual challenge for the Brahmaputra valley and the wider region, and disaster preparedness continues to be an important area of focus for local and national authorities alike.", "categories": ["Featured", "Historical Conflicts"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []},
{"id": "seed_hornbill_winter_story", "title": "Winter Is Near, the Hornbill Is Near", "slug": "winter-is-near-the-hornbill-is-near", "state": "Nagaland", "intro": "As winter approaches Nagaland, preparations begin for the Hornbill Festival, the state's best-known celebration of Naga culture.", "content": "As the air over the Naga hills turns cool and the harvest season winds down, a familiar excitement begins to build: the Hornbill Festival is near. Held every year from the 1st to the 10th of December at Kisama Heritage Village near Kohima, the festival is named after the hornbill bird, which holds deep significance in the folklore and traditional attire of many Naga tribes, often featured in ceremonial headgear and dance. During the festival, tribes from across Nagaland set up traditional morungs (community houses) side by side, sharing their distinct songs, dances, food, and crafts with visitors from across India and around the world. Winter in Nagaland is also a season of quieter rhythms in the villages, as fields lie fallow after harvest and communities turn toward festivity, storytelling, and rest. For many Naga people, the approach of winter and the approach of Hornbill have become intertwined in the yearly calendar, one marking the turn of the season, the other marking a shared celebration of identity and heritage.", "categories": ["Featured", "Festivals & Celebrations"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []},
{"id": "seed_ne_fashion", "title": "The Rich Fashion Sense of Northeast India", "slug": "the-rich-fashion-sense-of-northeast-india", "state": "Assam", "intro": "Northeast India's traditional textiles and evolving contemporary fashion reflect a deep, living connection to craft and identity.", "content": "Northeast India is home to an extraordinary range of traditional textiles and clothing, each tribe and community carrying its own distinct patterns, weaves, and colours passed down through generations. Assam's Muga, Eri, and Pat silks are renowned for their texture and natural sheen, while Nagaland's tribal shawls, each pattern carrying specific meaning and status, remain a proud marker of identity. Mizoram's Puanchei and Manipur's Moirang Phee and Innaphi are similarly celebrated for their intricate handloom work. Handloom weaving across the region is often done by women, and skills are frequently passed from mother to daughter as both a livelihood and a cultural inheritance. In recent years, young designers from the Northeast have begun blending these traditional textiles and motifs into contemporary fashion, gaining recognition on national and even international platforms. This growing visibility has helped bring renewed appreciation, and much-needed economic opportunity, to the weavers and artisans whose work forms the foundation of the region's distinctive fashion sense.", "categories": ["Featured", "Traditional Clothing"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []},
{"id": "seed_ne_nature", "title": "The Nature of Northeast India", "slug": "the-nature-of-northeast-india", "state": "Assam", "intro": "Northeast India is one of the most biodiverse regions on Earth, home to dense forests, major rivers, and a striking range of landscapes.", "content": "Northeast India lies within the Eastern Himalaya and Indo-Burma biodiversity hotspots, making it one of the most ecologically rich regions in the world. The landscape ranges from the floodplains of the Brahmaputra and Barak rivers to the dense forests and rolling hills of Meghalaya, Nagaland, and Mizoram, up to the high Himalayan terrain of Arunachal Pradesh and Sikkim. Meghalaya, whose name means 'abode of clouds', receives some of the highest rainfall recorded anywhere on Earth, particularly around Mawsynram and Cherrapunji, giving rise to lush forests, waterfalls, and unique living root bridges grown by local Khasi and Jaintia communities. Assam's floodplains support fertile agricultural land and internationally significant wetlands. The region's forests remain vital carbon sinks and water sources for the wider Indian subcontinent. This rich and varied natural landscape has shaped the customs, livelihoods, and spiritual beliefs of Northeast India's many communities for generations.", "categories": ["Featured", "Nature & Wildlife"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []},
{"id": "seed_ne_wildlife", "title": "The Wildlife of Northeast India", "slug": "the-wildlife-of-northeast-india", "state": "Assam", "intro": "Northeast India's forests and grasslands shelter some of the country's most significant wildlife, including the one-horned rhinoceros and Asiatic elephant.", "content": "Northeast India's forests, wetlands, and grasslands support an exceptional range of wildlife. Kaziranga National Park in Assam, a UNESCO World Heritage Site, is globally renowned as home to the largest population of the Indian one-horned rhinoceros, alongside significant populations of Asiatic elephants, wild water buffalo, and Bengal tigers. Manas National Park, also in Assam, is another UNESCO-listed site supporting tigers, elephants, and the rare golden langur. Arunachal Pradesh's forests host species such as the red panda, snow leopard, and numerous hornbill species, while Nagaland's Intanki National Park and Mizoram's Dampa Tiger Reserve protect further stretches of biodiverse forest. The region is also considered a global hotspot for bird diversity, with hundreds of resident and migratory species recorded, including several hornbill species of deep cultural importance to local tribes. Conservation efforts across the Northeast, often involving local community participation, continue to play a vital role in protecting this rich natural heritage for future generations.", "categories": ["Featured", "Nature & Wildlife"], "tags": [], "references": [], "imageUrl": "", "imageCaption": "", "imageCredit": "", "infobox": {}, "authorId": "seed", "authorName": "Northeast Encyclopedia", "createdAt": "2026-09-22T00:00:00.000Z", "updatedAt": "2026-09-22T00:00:00.000Z", "verified": true, "views": 0, "relatedIds": [], "talk": []}],tribes:P1,dict:z1,stories:T1,people:O1,places:R1,revisions:[],donations:[{id:"don1",amount:500,status:"successful",date:"2024-11-20",transactionId:"TXN-RAZOR-001",donor:"Anonymous Supporter"}],settings:{adsEnabled:!1,lastBackup:"Never",siteTitle <script>
(function(){
// Ensure login fields are BLANK when login opens
function ensureBlankFields(){
  // Find login modal/section
  let loginModal = document.querySelector('[class*="Log in"]') || document.body;
  document.querySelectorAll('input').forEach(inp=>{
    let isLoginField = false;
    let parentText = (inp.closest('div')?.textContent||"").toLowerCase();
    let ph = (inp.placeholder||"").toLowerCase();
    if(ph.includes("username") || ph.includes("••••") || parentText.includes("log in")){
      isLoginField = true;
    }
    // Check if login modal is open
    let loginVisible = document.body.innerHTML.includes("Log in") && inp.offsetParent!==null;
    if(isLoginField && loginVisible){
      // If no user logged in, ensure blank
      let hasUser = false;
      try { hasUser = !!localStorage.getItem("ne_current_user"); } catch(e){}
      if(!hasUser && inp.value){
        // Check if value looks like test credential
        let val = inp.value.toLowerCase();
        if(val.includes("benjamin") || val.includes("admin") || val.includes("benjaminyanthan")){
          inp.value="";
          console.log("NE SECURE: Cleared pre-filled credential from login field");
        }
      }
    }
  });
}
setInterval(ensureBlankFields, 1000);
ensureBlankFields();

// Eye icon - secure show/hide password 👁️
function addEye(){
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    if(inp.dataset.neEye) return;
    inp.dataset.neEye='1';
    let p=inp.parentElement;
    if(!p) return;
    if(p.classList.contains('ne-eye-wrapper')) return;
    // Ensure blank on first open
    if(!localStorage.getItem("ne_current_user")){
      // Keep blank, don't pre-fill
    }
    let w=document.createElement('div');
    w.className='ne-eye-wrapper';
    w.style.position='relative'; w.style.display='inline-block'; w.style.width='100%';
    p.insertBefore(w,inp); w.appendChild(inp);
    let b=document.createElement('button');
    b.type='button'; 
    b.innerHTML='👁️';
    b.title='Show/hide password';
    b.style.cssText='position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;font-size:18px;z-index:9;line-height:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;';
    b.setAttribute('aria-label','Show password');
    w.appendChild(b); 
    inp.style.paddingRight='44px';
    b.onclick=function(e){ 
      e.preventDefault(); e.stopPropagation(); 
      if(inp.type==='password'){ 
        inp.type='text'; 
        b.innerHTML='🙈'; 
        b.setAttribute('aria-label','Hide password');
      } else { 
        inp.type='password'; 
        b.innerHTML='👁️'; 
        b.setAttribute('aria-label','Show password');
      } 
    };
  });
}
setInterval(addEye,800);
addEye();

// UPI FIX - custom amount only, no chips, no bank doc, no false success
function fixUPI(){
  document.querySelectorAll('a[href^="upi://"]').forEach(a=>{
    if(a.dataset.neFixed) return;
    a.dataset.neFixed='1';
    a.addEventListener('click', function(e){
      let href=a.getAttribute('href')||'';
      let m=href.match(/&am=([^&]+)/);
      let amt=m?decodeURIComponent(m[1]):'';
      if(amt){
        let n=parseFloat(amt);
        if(isNaN(n)||n<=0){ e.preventDefault(); alert('Please enter valid amount, e.g. 100'); return; }
        if(n<1){ e.preventDefault(); alert('Minimum contribution is ₹1'); return; }
        if(n>100000){ e.preventDefault(); alert('Maximum ₹1,00,000'); return; }
      } else {
        let amountInput = document.querySelector('input[placeholder*="amount" i], input[inputmode="numeric"], input[type="number"]');
        if(amountInput && !amountInput.value.trim()){
          e.preventDefault();
          alert('Please enter contribution amount (₹1 to ₹1,00,000)');
          amountInput.focus();
          return;
        }
      }
      try{ localStorage.setItem('ne_last_upi_attempt', JSON.stringify({amount: amt||'custom', time: new Date().toISOString(), initiated:true})); }catch(e){}
      console.log('NE UPI: Payment INITIATED for', amt||'custom', '- NOT verified yet');
      setTimeout(()=>{
        let msg=document.createElement('div');
        msg.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a237e;color:white;padding:12px 20px;border-radius:12px;z-index:9999;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.3);max-width:90%;text-align:center;';
        msg.innerHTML='Payment initiated - Please approve in your UPI app (GPay/PhonePe/Paytm/BHIM).<br><span style="font-size:11px;opacity:0.9;">Amount will be confirmed by your bank. This site only initiates UPI, does not verify receipt automatically.</span>';
        document.body.appendChild(msg);
        setTimeout(()=>msg.remove(), 6000);
      }, 300);
    });
  });
  // Remove bank doc upload

<!-- D1 BRIDGE V31 - watches ne_encyclopedia_db_v1.articles, per-ID baseline -->
<script>
(function(){
  try{
    console.log('[D1-BRIDGE-V31] Loaded - watching ne_encyclopedia_db_v1');

    // baselineMap: articleId -> JSON string of that article's content as of last
    // confirmed-in-sync state (either at startup, or after a successful D1 save,
    // or after a poll tick where nothing needed saving). Keyed by id (not by
    // whole-array position) so reordering/prepending never causes false positives,
    // and so multiple articles changing in the same tick can each be tracked and
    // advanced independently once (and only once) their own save succeeds.
    let baselineMap = {};
    let inFlight = {};   // articleId -> true while a save request is pending
    let syncing = false; // simple lock so poll ticks don't overlap each other

    function getToken(){
      try{
        return localStorage.getItem('ne_auth_token')||localStorage.getItem('ne_token')||'';
      }catch{ return ''; }
    }

    // Reads the live app database and returns just the articles array,
    // filtered to well-formed objects with an id.
    function getDbArticles(){
      try{
        const raw=localStorage.getItem('ne_encyclopedia_db_v1');
        if(!raw) return [];
        const db=JSON.parse(raw);
        if(!db||!Array.isArray(db.articles)) return [];
        return db.articles.filter(a=>a&&typeof a==='object'&&a.id);
      }catch(e){ return []; }
    }

    function establishBaseline(){
      const list=getDbArticles();
      baselineMap={};
      list.forEach(a=>{ try{ baselineMap[a.id]=JSON.stringify(a); }catch{} });
      console.log('[D1-BRIDGE-V31] Baseline established - '+list.length+' articles in ne_encyclopedia_db_v1');
    }

    // Saves a single article to D1. Only on confirmed success does this
    // article's own baseline entry advance - unrelated articles are untouched,
    // and a failed/skipped save simply leaves that id due for retry next tick.
    function saveArticle(article, curJSON){
      return new Promise((resolve)=>{
        if(!article||!article.id||!article.title){
          console.log('[D1-BRIDGE-V31] Invalid article skip', article);
          resolve(false); return;
        }
        const token=getToken();
        if(!token){
          console.log('[D1-BRIDGE-V31] Token MISSING - skip save, will retry', article.id);
          resolve(false); return;
        }
        inFlight[article.id]=true;
        (async()=>{
          try{
            console.log('[D1-BRIDGE-V31] Saving', article.id, article.title);
            const res=await fetch('/api/d1/save-article',{
              method:'POST',
              headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
              body: JSON.stringify({article: Object.assign({}, article, {updatedAt: new Date().toISOString()})})
            });
            console.log('[D1-BRIDGE-V31] HTTP', res.status, res.statusText, article.id);
            let j=null;
            try{ j=await res.json(); }catch(e){
              const txt=await res.text().catch(()=> '');
              console.log('[D1-BRIDGE-V31] non-JSON response', txt.slice(0,200));
              j={success:false};
            }
            if(j&&j.success){
              // Advance ONLY this article's baseline, to exactly the content
              // that was actually read from localStorage this tick (curJSON),
              // not the outgoing payload with its overridden updatedAt.
              baselineMap[article.id]=curJSON;
              console.log('[D1-BRIDGE-V31] D1 success - baseline advanced for', article.id);
              resolve(true);
            } else {
              console.log('[D1-BRIDGE-V31] D1 failed - will retry', article.id, j);
              resolve(false);
            }
          }catch(e){
            console.log('[D1-BRIDGE-V31] fetch error', e.message||e, article.id);
            resolve(false);
          }finally{
            delete inFlight[article.id];
          }
        })();
      });
    }

    async function pollTick(){
      if(syncing) return; // avoid overlapping ticks if a previous save is slow
      syncing=true;
      try{
        const list=getDbArticles();
        const changed=[]; // [{article, curJSON}]
        list.forEach(a=>{
          if(!a||!a.id) return;
          if(inFlight[a.id]) return; // already being saved, don't re-queue
          let curJSON; try{ curJSON=JSON.stringify(a); }catch{ return; }
          const prevJSON=baselineMap[a.id];
          if(prevJSON===undefined || prevJSON!==curJSON){
            changed.push({article:a, curJSON});
          }
        });
        if(changed.length===0){ syncing=false; return; }
        console.log('[D1-BRIDGE-V31] Detected '+changed.length+' changed/new article(s)');
        // Save sequentially: simple, avoids parallel requests, and each
        // article's baseline only advances on its own confirmed success -
        // this is what prevents a second same-tick edit from being silently
        // swallowed into the baseline before it's actually saved.
        for(const item of changed){
          await saveArticle(item.article, item.curJSON);
        }
      }catch(e){ console.log('[D1-BRIDGE-V31] poll error', e); }
      finally{ syncing=false; }
    }

    function startPolling(){
      establishBaseline();
      setInterval(pollTick, 1500);
      console.log('[D1-BRIDGE-V31] Polling ne_encyclopedia_db_v1 every 1500ms started');
    }

    let started=false;
    function startOnce(){
      if(started) return;
      started=true;
      startPolling();
    }

    // No artificial delay before establishing baseline: the old 2-second
    // delay could let an article published in that window get absorbed into
    // the initial baseline and never be detected as new. Baseline is taken
    // as soon as this script runs (which is at the end of body, after the
    // app's own localStorage read on mount).
    startOnce();
    window.addEventListener('load', startOnce); // safety net, no-ops if already started

  }catch(e){ console.log('[D1-BRIDGE-V31] init error', e); }
})();
</script>
